name: Docs

# Builds the documentation site from docs/ (mkdocs.yml) with broken links and anchors as errors, and deploys it to
# GitHub Pages from master: on a push that changes the site, or when run by hand (docs/development.md, "Documentation").
on:
  push:
    branches: [develop, master]
    paths: [docs/**, mkdocs.yml, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The image pins Material for MkDocs and MkDocs 1.x; the version is the only one to update.
      - name: Build
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/docs" squidfunk/mkdocs-material:9.7.7
          build --strict --site-dir /docs/site

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          path: site/

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
