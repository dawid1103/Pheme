name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # SDK version comes from global.json.
      - uses: actions/setup-dotnet@v6

      # Package versions live only in Directory.Packages.props (CPM), so it keys the cache.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'nuget.config', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # A test project's name ends with its kind, which its tests get as the trait Category
      # (tests/Directory.Build.props): *.UnitTests need nothing outside the process, *.IntegrationTests start
      # PostgreSQL in Testcontainers (Docker).
      # Exit code 8 (no test ran) is ignored: a project of the other kind runs none.
      - name: Unit tests
        run: dotnet test --configuration Release --no-build --filter-trait "Category=Unit" --ignore-exit-code 8

      - name: Integration tests
        run: dotnet test --configuration Release --no-build --filter-trait "Category=Integration" --ignore-exit-code 8

      # Checks that the packages build; they are kept as an artifact of the run, never pushed.
      - name: Pack
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" --configuration Release --no-build --output artifacts
          done

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/
