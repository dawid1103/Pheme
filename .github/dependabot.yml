version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # The packages the libraries reference stay at the lowest version of the .NET 10 band, so their users are free to
    # choose newer patches (docs/development.md, "Packages"). Version updates of these would raise that minimum;
    # security updates are not affected by ignore.
    ignore:
      - dependency-name: FluentValidation
      - dependency-name: Microsoft.EntityFrameworkCore
      - dependency-name: Microsoft.EntityFrameworkCore.Relational
      - dependency-name: Microsoft.Extensions.DependencyInjection.Abstractions
      - dependency-name: Microsoft.Extensions.Diagnostics.HealthChecks
      - dependency-name: Microsoft.Extensions.Hosting.Abstractions
      - dependency-name: Microsoft.Extensions.Logging.Abstractions
      - dependency-name: Microsoft.Extensions.Options
      # Referenced by Pheme.UnitTests, which pins the libraries' transitive packages: a newer patch would need a newer
      # Microsoft.Extensions.DependencyInjection.Abstractions than the pinned 10.0.0 (NU1109).
      - dependency-name: Microsoft.Extensions.DependencyInjection
      - dependency-name: Microsoft.Extensions.Diagnostics
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
